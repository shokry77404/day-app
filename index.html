<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Day</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="application-name" content="My Day">
<meta name="apple-mobile-web-app-title" content="My Day">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
<style>
:root{
  --bg:#FFFFFF;--fg:#111111;--sec:#777777;--border:#E7E7E7;--muted:#F7F7F7;--btn-bg:#111111;--btn-fg:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#111111;--fg:#F2F2F2;--sec:#8A8A8A;--border:#2B2B2B;--muted:#1B1B1B;--btn-bg:#F2F2F2;--btn-fg:#111111;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#111111;--fg:#F2F2F2;--sec:#8A8A8A;--border:#2B2B2B;--muted:#1B1B1B;--btn-bg:#F2F2F2;--btn-fg:#111111;color-scheme:dark;}
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'IBM Plex Mono',ui-monospace,monospace;-webkit-font-smoothing:antialiased;
  padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0);background:var(--bg);z-index:20;}
#root{max-width:460px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column;background:var(--bg);}
.scr{display:flex;flex-direction:column;flex:1;min-height:100vh;animation:fade .18s ease;}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.18)}100%{transform:scale(1)}}
.header{padding:20px 20px 10px;position:sticky;top:0;background:var(--bg);z-index:10;}
.header-row{display:flex;align-items:baseline;justify-content:space-between;}
.h-title{font-size:22px;font-weight:700;letter-spacing:-.02em;}
.h-date{font-size:12px;color:var(--sec);margin-left:8px;}
.h-week{font-size:12px;color:var(--sec);}
.iconbtn{background:none;border:none;color:var(--fg);cursor:pointer;padding:4px;display:flex;align-items:center;transition:opacity .15s;}
.iconbtn:hover{opacity:.6;}
.textbtn{background:none;border:none;color:var(--sec);font-family:inherit;font-size:11px;cursor:pointer;padding:4px 0;transition:color .15s;}
.textbtn:hover{color:var(--fg);}
.toprow{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
.progress-wrap{padding:10px 20px 6px;}
.progress-top{display:flex;justify-content:space-between;font-size:10px;color:var(--sec);margin-bottom:6px;letter-spacing:.02em;}
.progress-track{height:3px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:var(--fg);transition:width .25s ease;}
.list{padding:4px 20px;flex:1;}
.task-row{display:flex;align-items:center;gap:10px;padding:12px 6px;margin:0 -6px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:6px;transition:background-color .15s;}
.task-row:last-child{border-bottom:none;}
@media (hover:hover){
  .task-row:hover{background:var(--muted);}
  .task-del{opacity:0;}
  .task-row:hover .task-del{opacity:1;}
}
.chk{width:17px;height:17px;flex:none;border:1.5px solid var(--fg);background:transparent;border-radius:3px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;transition:background .15s,border-color .15s;}
.chk-on{background:var(--fg);border-color:var(--fg);animation:pop .18s ease;}
.task-title{font-size:14px;transition:color .2s ease;}
.task-title.done{color:var(--sec);text-decoration:line-through;}
.task-title-wrap{flex:1;min-width:0;}
.task-del{background:none;border:none;color:var(--sec);cursor:pointer;padding:5px;display:flex;align-items:center;flex:none;transition:opacity .15s,color .15s;border-radius:5px;}
.task-del:hover{color:var(--fg);}
.empty{color:var(--sec);font-size:13px;padding:28px 4px;text-align:center;}
.agenda{margin-top:8px;border-top:1px solid var(--border);}
.agenda-grid{display:grid;grid-template-columns:1fr 1fr;}
.agenda-card{padding:14px 10px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);cursor:pointer;transition:background-color .15s;}
@media (hover:hover){.agenda-card:hover{background:var(--muted);}}
.agenda-card:nth-child(2n){border-right:none;}
.agenda-head{display:flex;justify-content:space-between;gap:6px;font-size:11px;margin-bottom:6px;}
.agenda-head span:first-child{font-weight:600;}
.agenda-head span.wd{color:var(--sec);font-weight:400;}
.agenda-task{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 0;color:var(--fg);}
.agenda-task.done{color:var(--sec);text-decoration:line-through;}
.agenda-dot{width:9px;height:9px;border:1px solid var(--fg);border-radius:2px;flex:none;}
.agenda-dot.on{background:var(--fg);}
.agenda-task span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bottom-btn-wrap{position:sticky;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom,0));background:var(--bg);border-top:1px solid var(--border);}
.btn-main{width:100%;background:var(--btn-bg);color:var(--btn-fg);border:none;border-radius:8px;padding:15px;font-family:inherit;font-size:14px;font-weight:600;letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn-main:active{opacity:.85;transform:scale(.99);}
.back-row{display:flex;align-items:center;gap:8px;}
.dd-title{font-size:20px;font-weight:700;}
.datenav{display:flex;border-top:1px solid var(--border);position:sticky;bottom:0;background:var(--bg);padding-bottom:env(safe-area-inset-bottom,0);}
.datenav-item{flex:1;text-align:center;padding:14px 4px;font-size:11px;color:var(--sec);cursor:pointer;transition:color .15s;}
.datenav-item:hover{color:var(--fg);}
.datenav-item.cur{color:var(--fg);font-weight:600;text-decoration:underline;text-underline-offset:4px;}
.cal-head{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px;}
.cal-month{font-size:15px;font-weight:700;}
.cal-wd{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;color:var(--sec);padding:0 20px 6px;border-bottom:1px solid var(--border);}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);margin:0 20px;}
.cal-cell{min-height:60px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:4px;cursor:pointer;display:flex;flex-direction:column;transition:background-color .15s;}
@media (hover:hover){.cal-cell:not(.empty):hover{background:var(--muted);}}
.cal-cell.empty{cursor:default;}
.cal-num{font-size:11px;}
.cal-num.today{text-decoration:underline;text-underline-offset:3px;font-weight:700;}
.cal-task{font-size:9px;color:var(--sec);margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-more{font-size:9px;color:var(--sec);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease;}
.sheet{background:var(--bg);width:100%;max-width:460px;border-radius:16px 16px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0));border:1px solid var(--border);}
.sheet h3{margin:0 0 14px;font-size:15px;}
.confirm-sheet{max-width:400px;border-radius:14px;margin:0 20px calc(20px + env(safe-area-inset-bottom,0));}
.confirm-msg{font-size:12.5px;color:var(--sec);margin:-6px 0 16px;line-height:1.5;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:10px;color:var(--sec);margin-bottom:5px;letter-spacing:.04em;}
.field input,.field textarea{width:100%;border:1px solid var(--border);background:var(--muted);color:var(--fg);border-radius:7px;padding:10px;font-family:inherit;font-size:13px;transition:outline-color .15s;}
.field input:focus,.field textarea:focus{outline:2px solid var(--fg);outline-offset:1px;}
.field textarea{resize:none;min-height:60px;}
.sheet-actions{display:flex;gap:10px;margin-top:4px;}
.btn-sec{flex:1;background:transparent;border:1px solid var(--border);color:var(--fg);border-radius:8px;padding:12px;font-family:inherit;font-size:13px;cursor:pointer;transition:background-color .15s;}
@media (hover:hover){.btn-sec:hover{background:var(--muted);}}
.btn-pri{flex:1;background:var(--btn-bg);color:var(--btn-fg);border:none;border-radius:8px;padding:12px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:opacity .15s;}
.btn-pri:disabled{opacity:.35;cursor:not-allowed;}
@media (hover:hover){.btn-pri:not(:disabled):hover{opacity:.85;}}
.del-link{display:block;width:100%;text-align:center;margin-top:12px;font-size:11px;color:var(--sec);background:none;border:none;cursor:pointer;font-family:inherit;transition:color .15s;}
.del-link:hover{color:var(--fg);}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const {useState,useEffect,useRef} = React;
const STORAGE_KEY='editorial-todo-v1';
const pad=n=>String(n).padStart(2,'0');
const toISO=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=iso=>{const [y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);};
const computeToday=()=>toISO(new Date());
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const fmtLong=iso=>{const d=parseISO(iso);return `${pad(d.getDate())},${MONTHS[d.getMonth()]},${d.getFullYear()}`;};
const fmtShort=iso=>{const d=parseISO(iso);return `${pad(d.getDate())} ${MONTHS[d.getMonth()]}`;};
const weekday=iso=>WD[parseISO(iso).getDay()];
const addDays=(iso,n)=>toISO(new Date(parseISO(iso).getTime()+n*86400000));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function loadTasks(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(!raw) return [];
    const p=JSON.parse(raw);
    return Array.isArray(p)?p.filter(t=>t&&typeof t.id==='string'&&typeof t.date==='string'&&typeof t.title==='string'):[];
  }catch(e){ return []; }
}

function CalIcon(){return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>;}
function BackIcon(){return <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M15 18l-6-6 6-6"/></svg>;}
function CheckIcon(){return <svg width="10" height="10" viewBox="0 0 16 16"><path d="M2 8.5l4 4 8-9" stroke="var(--btn-fg)" strokeWidth="2.2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>;}
function TrashIcon(){return <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M4 7h16M9 7V5a1 1 0 011-1h4a1 1 0 011 1v2m2 0l-1 13a2 2 0 01-2 2H8a2 2 0 01-2-2L5 7h14z"/></svg>;}
function PlusIcon(){return <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>;}

function Checkbox({checked,onClick}){
  return <button className={"chk"+(checked?" chk-on":"")} onClick={onClick} aria-label="toggle complete">{checked && <CheckIcon/>}</button>;
}

function ProgressBar({tasks}){
  if(tasks.length===0) return null;
  const done=tasks.filter(t=>t.completed).length;
  const pct=Math.round((done/tasks.length)*100);
  return (
    <div className="progress-wrap">
      <div className="progress-top"><span>{done} of {tasks.length} done</span><span>{pct}%</span></div>
      <div className="progress-track"><div className="progress-fill" style={{width:pct+'%'}}/></div>
    </div>
  );
}

function TaskRow({task,onToggle,onOpen,onRequestDelete}){
  return (
    <div className="task-row" onClick={()=>onOpen(task)}>
      <Checkbox checked={task.completed} onClick={e=>{e.stopPropagation();onToggle(task.id);}}/>
      <div className="task-title-wrap"><span className={"task-title"+(task.completed?" done":"")}>{task.title}</span></div>
      <button className="task-del" aria-label="delete task" onClick={e=>{e.stopPropagation();onRequestDelete(task);}}><TrashIcon/></button>
    </div>
  );
}

function AgendaCard({date,tasks,onOpen}){
  const shown=tasks.slice(0,4);
  return (
    <div className="agenda-card" onClick={()=>onOpen(date)}>
      <div className="agenda-head"><span>{fmtLong(date)}</span><span className="wd">{weekday(date)}</span></div>
      {shown.map(t=>(
        <div key={t.id} className={"agenda-task"+(t.completed?" done":"")}>
          <span className={"agenda-dot"+(t.completed?" on":"")}/>
          <span>{t.title}</span>
        </div>
      ))}
    </div>
  );
}

function TodayView({today,tasks,onToggle,onOpenForm,onOpenDay,onOpenCal,onRequestDelete,onRequestClearToday}){
  const todays=tasks.filter(t=>t.date===today).sort((a,b)=>a.createdAt<b.createdAt?-1:1);
  const others={};
  tasks.forEach(t=>{if(t.date!==today){(others[t.date]=others[t.date]||[]).push(t);}});
  const otherDates=Object.keys(others).sort((a,b)=>b.localeCompare(a));
  return (
    <div className="scr">
      <div className="header">
        <div className="header-row">
          <div><span className="h-title">Today</span><span className="h-date">{fmtLong(today)}</span></div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span className="h-week">{weekday(today)}</span>
            <button className="iconbtn" onClick={onOpenCal} aria-label="open calendar"><CalIcon/></button>
          </div>
        </div>
        {todays.length>0 && (
          <div className="toprow">
            <span/>
            <button className="textbtn" onClick={onRequestClearToday}>Clear today</button>
          </div>
        )}
      </div>
      <ProgressBar tasks={todays}/>
      <div className="list">
        {todays.length===0 && <div className="empty">No tasks yet — add your first one below.</div>}
        {todays.map(t=><TaskRow key={t.id} task={t} onToggle={onToggle} onOpen={onOpenForm} onRequestDelete={onRequestDelete}/>)}
        {otherDates.length>0 && (
          <div className="agenda">
            <div className="agenda-grid">
              {otherDates.map(d=><AgendaCard key={d} date={d} tasks={others[d].slice().sort((a,b)=>a.createdAt<b.createdAt?-1:1)} onOpen={onOpenDay}/>)}
            </div>
          </div>
        )}
      </div>
      <div className="bottom-btn-wrap">
        <button className="btn-main" onClick={()=>onOpenForm(null,today)}><PlusIcon/>New task</button>
      </div>
    </div>
  );
}

function DayDetailView({date,tasks,onToggle,onOpenForm,onNav,onBack,onRequestDelete}){
  const list=tasks.filter(t=>t.date===date).sort((a,b)=>a.createdAt<b.createdAt?-1:1);
  const prev=addDays(date,-1), next=addDays(date,1);
  return (
    <div className="scr">
      <div className="header">
        <div className="back-row">
          <button className="iconbtn" onClick={onBack} aria-label="back"><BackIcon/></button>
          <div style={{flex:1}}><div className="dd-title">{fmtLong(date)}</div></div>
          <span className="h-week">{weekday(date)}</span>
        </div>
      </div>
      <ProgressBar tasks={list}/>
      <div className="list">
        {list.length===0 && <div className="empty">Nothing planned here yet.</div>}
        {list.map(t=><TaskRow key={t.id} task={t} onToggle={onToggle} onOpen={onOpenForm} onRequestDelete={onRequestDelete}/>)}
      </div>
      <div className="bottom-btn-wrap" style={{borderTop:'none',paddingBottom:14}}>
        <button className="btn-main" onClick={()=>onOpenForm(null,date)}><PlusIcon/>New task</button>
      </div>
      <div className="datenav">
        <div className="datenav-item" onClick={()=>onNav(prev)}>{fmtShort(prev)}</div>
        <div className="datenav-item cur">{fmtShort(date)}</div>
        <div className="datenav-item" onClick={()=>onNav(next)}>{fmtShort(next)}</div>
      </div>
    </div>
  );
}

function CalendarView({ym,setYm,today,tasks,onPick,onBack}){
  const {y,m}=ym;
  const first=new Date(y,m,1).getDay();
  const days=new Date(y,m+1,0).getDate();
  const cells=[];
  for(let i=0;i<first;i++)cells.push(null);
  for(let d=1;d<=days;d++)cells.push(toISO(new Date(y,m,d)));
  while(cells.length%7)cells.push(null);
  const byDate={};
  tasks.forEach(t=>{(byDate[t.date]=byDate[t.date]||[]).push(t);});
  return (
    <div className="scr">
      <div className="header">
        <div className="back-row">
          <button className="iconbtn" onClick={onBack} aria-label="back"><BackIcon/></button>
        </div>
        <div className="cal-head">
          <button className="iconbtn" onClick={()=>setYm(m===0?{y:y-1,m:11}:{y,m:m-1})} aria-label="previous month">&lsaquo;</button>
          <span className="cal-month">{MONTHS[m]} {y}</span>
          <button className="iconbtn" onClick={()=>setYm(m===11?{y:y+1,m:0}:{y,m:m+1})} aria-label="next month">&rsaquo;</button>
        </div>
      </div>
      <div className="cal-wd">{WD.map(w=><div key={w}>{w[0]}</div>)}</div>
      <div className="cal-grid">
        {cells.map((c,i)=>{
          if(!c) return <div key={i} className="cal-cell empty"/>;
          const dayTasks=byDate[c]||[];
          return (
            <div key={i} className="cal-cell" onClick={()=>onPick(c)}>
              <span className={"cal-num"+(c===today?" today":"")}>{Number(c.slice(8))}</span>
              {dayTasks[0] && <span className="cal-task">{dayTasks[0].title}</span>}
              {dayTasks.length>1 && <span className="cal-more">+{dayTasks.length-1}</span>}
            </div>
          );
        })}
      </div>
    </div>
  );
}

function TaskForm({task,defaultDate,onSave,onClose}){
  const [title,setTitle]=useState(task?task.title:'');
  const [date,setDate]=useState(task?task.date:defaultDate);
  const [desc,setDesc]=useState(task?task.description:'');
  const ref=useRef(null);
  useEffect(()=>{ref.current&&ref.current.focus();},[]);
  useEffect(()=>{
    const h=e=>{if(e.key==='Escape')onClose();};
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[onClose]);
  const canSave=title.trim().length>0;
  const submit=()=>{
    if(!canSave)return;
    onSave({
      id:task?task.id:uid(),
      title:title.trim(),
      description:desc.trim(),
      date,
      completed:task?task.completed:false,
      createdAt:task?task.createdAt:new Date().toISOString(),
    });
  };
  return (
    <div className="overlay" onClick={onClose}>
      <div className="sheet" onClick={e=>e.stopPropagation()}>
        <h3>{task?'Edit task':'New task'}</h3>
        <div className="field"><label>Title</label>
          <input ref={ref} value={title} onChange={e=>setTitle(e.target.value)}
            onKeyDown={e=>{if(e.key==='Enter')submit();}} placeholder="Task title"/>
        </div>
        <div className="field"><label>Date</label>
          <input type="date" value={date} onChange={e=>setDate(e.target.value)}/>
        </div>
        <div className="field"><label>Description</label>
          <textarea value={desc} onChange={e=>setDesc(e.target.value)} placeholder="Optional"/>
        </div>
        <div className="sheet-actions">
          <button className="btn-sec" onClick={onClose}>Cancel</button>
          <button className="btn-pri" onClick={submit} disabled={!canSave}>Save</button>
        </div>
      </div>
    </div>
  );
}

function ConfirmDialog({title,message,confirmLabel,onConfirm,onCancel}){
  useEffect(()=>{
    const h=e=>{if(e.key==='Escape')onCancel();};
    window.addEventListener('keydown',h);
    return ()=>window.removeEventListener('keydown',h);
  },[onCancel]);
  return (
    <div className="overlay" onClick={onCancel}>
      <div className="sheet confirm-sheet" onClick={e=>e.stopPropagation()}>
        <h3>{title}</h3>
        <p className="confirm-msg">{message}</p>
        <div className="sheet-actions">
          <button className="btn-sec" onClick={onCancel}>Cancel</button>
          <button className="btn-pri" onClick={onConfirm}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [tasks,setTasks]=useState(loadTasks);
  const [today,setToday]=useState(computeToday);
  const [view,setView]=useState('today');
  const [curDate,setCurDate]=useState(computeToday);
  const [ym,setYm]=useState(()=>{const d=parseISO(computeToday());return {y:d.getFullYear(),m:d.getMonth()};});
  const [form,setForm]=useState(null);
  const [confirm,setConfirm]=useState(null);

  useEffect(()=>{
    try{ localStorage.setItem(STORAGE_KEY,JSON.stringify(tasks)); }catch(e){}
  },[tasks]);

  useEffect(()=>{
    const check=()=>{const t=computeToday();setToday(prev=>prev===t?prev:t);};
    const id=setInterval(check,30000);
    document.addEventListener('visibilitychange',check);
    window.addEventListener('focus',check);
    return ()=>{clearInterval(id);document.removeEventListener('visibilitychange',check);window.removeEventListener('focus',check);};
  },[]);

  const toggle=id=>setTasks(ts=>ts.map(t=>t.id===id?{...t,completed:!t.completed}:t));
  const save=t=>{ setTasks(ts=>{ const ex=ts.some(x=>x.id===t.id); return ex?ts.map(x=>x.id===t.id?t:x):[...ts,t]; }); setForm(null); };
  const del=id=>setTasks(ts=>ts.filter(t=>t.id!==id));
  const openForm=(task,defDate)=>setForm({task:task||null,defaultDate:defDate||curDate||today});
  const openDay=d=>{ setCurDate(d); setView('day'); };

  const requestDeleteTask=task=>{
    setConfirm({
      title:'Delete task',
      message:`Delete "${task.title}"? This can't be undone.`,
      confirmLabel:'Delete',
      onConfirm:()=>{ del(task.id); setConfirm(null); },
    });
  };
  const requestClearToday=()=>{
    const count=tasks.filter(t=>t.date===today).length;
    setConfirm({
      title:"Clear today's tasks",
      message:`This will delete all ${count} task${count===1?'':'s'} scheduled for today. This can't be undone.`,
      confirmLabel:'Clear',
      onConfirm:()=>{ setTasks(ts=>ts.filter(t=>t.date!==today)); setConfirm(null); },
    });
  };

  return (
    <React.Fragment>
      {view==='today' && <TodayView today={today} tasks={tasks} onToggle={toggle}
        onOpenForm={openForm} onOpenDay={openDay} onOpenCal={()=>setView('cal')}
        onRequestDelete={requestDeleteTask} onRequestClearToday={requestClearToday}/>}
      {view==='day' && <DayDetailView date={curDate} tasks={tasks} onToggle={toggle}
        onOpenForm={openForm} onNav={d=>setCurDate(d)} onBack={()=>setView('today')}
        onRequestDelete={requestDeleteTask}/>}
      {view==='cal' && <CalendarView ym={ym} setYm={setYm} today={today} tasks={tasks}
        onPick={openDay} onBack={()=>setView('today')}/>}
      {form && <TaskForm task={form.task} defaultDate={form.defaultDate}
        onSave={save} onClose={()=>setForm(null)}/>}
      {confirm && <ConfirmDialog title={confirm.title} message={confirm.message}
        confirmLabel={confirm.confirmLabel} onConfirm={confirm.onConfirm} onCancel={()=>setConfirm(null)}/>}
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('service-worker.js').catch(() => {});
  });
}
</script>
</body>
</html>
